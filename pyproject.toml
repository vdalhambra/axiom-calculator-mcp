[project]
name = "axiom-calculator-mcp"
version = "1.0.0"
description = "Personal finance calculators for AI agents — mortgage, compound interest, FIRE, loan comparison, and more. Zero API keys required."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Victor Dalhambra", email = "victor@axiom.tools" },
]
keywords = ["mcp", "finance", "calculator", "mortgage", "fire", "compound-interest", "loans", "personal-finance", "ai-agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business :: Financial",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "fastmcp>=3.2.0",
]

[project.scripts]
axiom-calculator-mcp = "calculator.server:main"
axiom-calculator = "calculator.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calculator"]
