name: axiom-calculator-mcp
description: "Personal finance calculators for Claude — mortgage payments, compound interest, FIRE retirement number, loan comparison, debt payoff, and inflation-adjusted returns. Zero API keys required, works instantly."
version: 1.0
runtime: python
entrypoint: src/calculator/server.py
install:
  - pip install -r requirements.txt
start: python3 -c "import sys; sys.path.insert(0,'/app/src'); from calculator.server import main; main()"
author: vdalhambra
license: MIT
tags:
  - finance
  - calculator
  - personal-finance
  - mortgage
  - investment
  - retirement
  - free
pricing:
  model: free
